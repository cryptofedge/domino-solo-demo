<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Mesa del Dominó — Partida Solitaria</title>
<style>
  :root{
    --gold:#e3bd6f; --gold-dim:#7a5d24; --ink:#0a0705;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--ink);color:#f3ecdd;overflow:hidden;}
  .app{width:100vw;height:100vh;max-width:480px;margin:0 auto;position:relative;display:flex;flex-direction:column;background:
    repeating-linear-gradient(100deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 5px),
    linear-gradient(160deg, #1c130a 0%, #120b06 45%, #0a0604 100%);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;position:relative;z-index:2;}
  .topbar a{color:var(--gold);text-decoration:none;font-size:13px;border:1px solid var(--gold-dim);border-radius:999px;padding:5px 12px;}
  .score-row{display:flex;justify-content:center;gap:10px;padding:2px 14px 6px;position:relative;z-index:2;}
  .nameplate{background:linear-gradient(180deg,#2a1f13,#150e08);border:1px solid var(--gold-dim);border-radius:9px;color:#e8d8ab;
    box-shadow:0 3px 6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);position:relative;}
  .score-pill{padding:5px 14px;display:flex;flex-direction:column;align-items:center;min-width:78px;}
  .score-pill .lbl{font-size:9px;letter-spacing:.08em;color:#a08a5c;}
  .score-pill .val{font-size:17px;font-weight:700;color:var(--gold);}
  .table-wrap{flex:1;position:relative;margin:2px 12px 8px;min-height:0;}
  .felt{position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse at 50% 38%, #1a5c34 0%, #0f4023 42%, #082a17 78%, #051c0e 100%);
    border:2px solid var(--gold-dim);box-shadow:inset 0 0 60px rgba(0,0,0,.65), inset 0 0 3px rgba(220,179,95,.3), 0 6px 16px rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .chain-area{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px;padding:16px;max-width:100%;max-height:100%;overflow:auto;}
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .seat.north{top:-14px;left:50%;transform:translateX(-50%);flex-direction:row;padding:6px 12px;}
  .seat.west{top:50%;left:-12px;transform:translateY(-50%);padding:8px 6px;}
  .seat.east{top:50%;right:-12px;transform:translateY(-50%);padding:8px 6px;}
  .avatar{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a2c14,#26160a);border:1.5px solid #9c7a34;
    display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:9px;box-shadow:inset 0 0 6px rgba(0,0,0,.5);flex-shrink:0;}
  .seat .info{font-size:9px;color:#8a7a58;text-align:center;white-space:nowrap;}
  .seat .info b{color:#f3ecdd;font-size:10px;display:block;}
  .seat.turn .avatar{box-shadow:0 0 10px 2px rgba(227,189,111,.85);border-color:var(--gold);}
  .facedown{width:14px;height:24px;border-radius:3px;background:linear-gradient(160deg,#2b1c0c,#160d05);border:1px solid var(--gold-dim);margin:0 1px;display:inline-block;}
  .turn-pill{display:flex;justify-content:center;margin:2px 0 6px;position:relative;z-index:2;}
  .turn-pill .chip{background:linear-gradient(180deg,rgba(227,189,111,0.22),rgba(227,189,111,0.10));border:1px solid var(--gold);border-radius:999px;
    padding:5px 18px;font-size:12px;color:#f7efd8;letter-spacing:.04em;font-weight:700;box-shadow:0 0 14px rgba(227,189,111,.2);}
  .actions{display:flex;justify-content:center;gap:8px;padding:0 14px 4px;position:relative;z-index:2;min-height:32px;}
  .actions button{background:linear-gradient(180deg,#3a2a10,#1c1206);border:1.5px solid var(--gold);border-radius:999px;padding:6px 20px;
    font-family:Georgia,serif;font-size:12px;color:#f7efd8;font-weight:700;cursor:pointer;letter-spacing:.03em;}
  .hand-row{display:flex;justify-content:center;gap:6px;padding:6px 10px 16px;position:relative;z-index:2;flex-wrap:wrap;}
  .tile-cyan{filter:drop-shadow(0 0 5px rgba(77,232,255,.5)) drop-shadow(0 2px 4px rgba(0,0,0,.5));}
  .hand-tile{cursor:pointer;transition:transform 140ms ease;position:relative;}
  .hand-tile.valid{cursor:pointer;}
  .hand-tile.invalid{opacity:.32;cursor:not-allowed;filter:grayscale(.5);}
  .hand-tile.selected{transform:translateY(-10px) scale(1.08);z-index:5;filter:drop-shadow(0 0 12px rgba(227,189,111,.95)) drop-shadow(0 6px 8px rgba(0,0,0,.6));}
  @keyframes slamRoutine{
    0%{transform:perspective(320px) rotateY(65deg) scale(.9);opacity:.5;}
    55%{transform:perspective(320px) rotateY(0deg) scaleX(1.25) scaleY(.7);opacity:1;}
    78%{transform:scaleX(.96) scaleY(1.05);}
    100%{transform:scaleX(1) scaleY(1);}
  }
  .chain-tile{animation:slamRoutine 280ms cubic-bezier(.2,.7,.3,1) both;}
  .sidepick{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);display:flex;gap:6px;margin-bottom:6px;z-index:10;}
  .sidepick button{background:linear-gradient(180deg,#3a2a10,#1c1206);border:1px solid var(--gold);border-radius:8px;padding:5px 9px;
    color:#f7efd8;font-size:10px;font-family:Georgia,serif;cursor:pointer;white-space:nowrap;}
  .modal-scrim{position:absolute;inset:0;background:rgba(4,2,1,.86);display:flex;align-items:center;justify-content:center;z-index:20;
    opacity:0;pointer-events:none;transition:opacity 220ms ease;}
  .modal-scrim.show{opacity:1;pointer-events:auto;}
  .modal{background:linear-gradient(180deg,#1c130a,#0e0904);border:1.5px solid var(--gold);border-radius:18px;padding:26px 24px;text-align:center;
    max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 30px rgba(227,189,111,.2);}
  .modal h2{margin:0 0 6px;font-size:26px;color:var(--gold);text-shadow:0 0 18px rgba(227,189,111,.5);}
  .modal p{margin:0 0 4px;font-size:13px;color:#d8cba4;}
  .modal .fichas{font-size:15px;color:#7be7a0;font-weight:700;margin:10px 0;}
  .modal button{margin-top:14px;background:linear-gradient(180deg,#3a2a10,#1c1206);border:1.5px solid var(--gold);border-radius:999px;
    padding:9px 24px;color:#f7efd8;font-family:Georgia,serif;font-size:13px;font-weight:700;cursor:pointer;}
  .toast{position:absolute;left:10%;right:10%;top:8%;text-align:center;background:linear-gradient(180deg,rgba(20,14,7,.97),rgba(10,7,4,.98));
    border:1px solid var(--gold);border-radius:8px;padding:7px 10px;color:var(--gold);font-size:11px;box-shadow:0 4px 14px rgba(0,0,0,.5);
    opacity:0;transition:opacity 200ms ease;pointer-events:none;z-index:15;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span style="font-size:11px;color:#5c4c30;letter-spacing:.08em;">DEMO</span>
    <div style="font-size:11px;letter-spacing:.1em;color:#8a7248;">LA MESA DEL DOMINÓ — PATIO</div>
    <div style="width:52px;"></div>
  </div>

  <div class="score-row">
    <div class="nameplate score-pill"><span class="lbl">EQUIPO A (Tú)</span><span class="val" id="scoreA">0</span></div>
    <div class="nameplate score-pill"><span class="lbl">EQUIPO B</span><span class="val" id="scoreB">0</span></div>
  </div>

  <div class="table-wrap">
    <div class="felt">
      <div class="chain-area" id="chainArea"></div>

      <div class="seat north" id="seatNorth">
        <div class="avatar">MB</div>
        <div class="info"><b id="northCount">7</b>Meche (compañera)</div>
        <div id="northTiles"></div>
      </div>
      <div class="seat west" id="seatWest">
        <div class="avatar">PC</div>
        <div class="info"><b id="westCount">7</b>Pancho</div>
      </div>
      <div class="seat east" id="seatEast">
        <div class="avatar">TL</div>
        <div class="info"><b id="eastCount">7</b>Tulio</div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="turn-pill"><div class="chip" id="turnChip">Tu turno</div></div>
  <div class="actions" id="actionsRow"></div>
  <div class="hand-row" id="handRow"></div>

  <div class="modal-scrim" id="modalScrim">
    <div class="modal">
      <h2 id="modalTitle">¡Domino!</h2>
      <p id="modalSub"></p>
      <p id="modalPips" style="margin-top:10px;font-size:11px;color:#8a7a58;"></p>
      <div class="fichas" id="modalFichas"></div>
      <button id="modalPlayAgain">Jugar otra vez</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var SEATS = [
    { id: 0, name: 'Tú', team: 'A', isBot: false, el: 'hand' },
    { id: 1, name: 'Pancho', team: 'B', isBot: true, el: 'west' },
    { id: 2, name: 'Meche', team: 'A', isBot: true, el: 'north' },
    { id: 3, name: 'Tulio', team: 'B', isBot: true, el: 'east' }
  ];

  var state = null;

  function vibrate(ms){
    try { if (navigator && navigator.vibrate) navigator.vibrate(ms); } catch(e){}
  }

  function buildDeck(){
    var deck = [];
    for (var a = 0; a <= 6; a++){
      for (var b = a; b <= 6; b++){
        deck.push({ x: a, y: b });
      }
    }
    return deck;
  }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function newGame(){
    var deck = shuffle(buildDeck());
    var hands = [[], [], [], []];
    for (var i = 0; i < deck.length; i++){
      hands[i % 4].push(deck[i]);
    }
    var starter = 0;
    for (var s = 0; s < 4; s++){
      for (var t = 0; t < hands[s].length; t++){
        if (hands[s][t].x === 6 && hands[s][t].y === 6) starter = s;
      }
    }
    state = {
      hands: hands,
      chain: [],
      turn: starter,
      passStreak: 0,
      scoreA: state ? state.scoreA : 0,
      scoreB: state ? state.scoreB : 0,
      over: false,
      selectedTileIdx: null,
      awaitingSide: false
    };
    render();
    if (starter !== 0){
      scheduleBotTurn();
    } else {
      showToast('Tienes el doble 6 — ¡abres tú!');
    }
  }

  function leftEnd(){ return state.chain.length ? state.chain[0].a : null; }
  function rightEnd(){ return state.chain.length ? state.chain[state.chain.length - 1].b : null; }

  function tileMatchesEnds(tile){
    if (!state.chain.length) return { left: true, right: true };
    var le = leftEnd(), re = rightEnd();
    return {
      left: tile.x === le || tile.y === le,
      right: tile.x === re || tile.y === re
    };
  }

  function playTile(seatId, tile, side){
    var hand = state.hands[seatId];
    var idx = hand.indexOf(tile);
    if (idx === -1) return false;

    var placed;
    if (!state.chain.length){
      placed = { a: tile.x, b: tile.y, isDouble: tile.x === tile.y, by: seatId };
      state.chain.push(placed);
    } else if (side === 'left'){
      var le = leftEnd();
      var touch = (tile.x === le) ? tile.x : tile.y;
      var open = (tile.x === le) ? tile.y : tile.x;
      placed = { a: open, b: touch, isDouble: tile.x === tile.y, by: seatId };
      state.chain.unshift(placed);
    } else {
      var re = rightEnd();
      var touch2 = (tile.x === re) ? tile.x : tile.y;
      var open2 = (tile.x === re) ? tile.y : tile.x;
      placed = { a: touch2, b: open2, isDouble: tile.x === tile.y, by: seatId };
      state.chain.push(placed);
    }

    hand.splice(idx, 1);
    state.passStreak = 0;

    if (hand.length === 0){
      var capicua = false;
      if (state.chain.length > 1){
        var m = tileMatchesEnds === null ? null : null;
      }
      capicua = checkCapicua(placed, side);
      endHand('domino', seatId, capicua);
      return true;
    }
    advanceTurn();
    return true;
  }

  function checkCapicua(placedTile, side){
    if (state.chain.length < 2) return false;
    var otherEnd = side === 'left' ? rightEnd() : (side === 'right' ? leftEnd() : null);
    if (otherEnd === null) return false;
    var value = side === 'left' ? placedTile.a : placedTile.b;
    return value === otherEnd || placedTile.isDouble;
  }

  function seatHasValidMove(seatId){
    var hand = state.hands[seatId];
    for (var i = 0; i < hand.length; i++){
      var m = tileMatchesEnds(hand[i]);
      if (m.left || m.right) return true;
    }
    return false;
  }

  function advanceTurn(){
    state.turn = (state.turn + 1) % 4;
    render();
    if (state.over) return;
    if (SEATS[state.turn].isBot){
      scheduleBotTurn();
    }
  }

  function passSeat(seatId){
    state.passStreak++;
    showToast(SEATS[seatId].name + ' pasó');
    if (state.passStreak >= 4){
      endHand('blocked', null, false);
      return;
    }
    advanceTurn();
  }

  function scheduleBotTurn(){
    setTimeout(function(){
      if (state.over) return;
      var seatId = state.turn;
      if (!SEATS[seatId].isBot) return;
      botMove(seatId);
    }, 650);
  }

  function botMove(seatId){
    var hand = state.hands[seatId];
    var choice = null, choiceSide = null;
    for (var i = 0; i < hand.length; i++){
      var m = tileMatchesEnds(hand[i]);
      if (m.left || m.right){
        choice = hand[i];
        choiceSide = m.left ? 'left' : 'right';
        if (hand[i].x === hand[i].y) break;
      }
    }
    if (!choice){
      passSeat(seatId);
      return;
    }
    vibrate(20);
    playTile(seatId, choice, choiceSide);
  }

  function endHand(kind, winnerSeat, capicua){
    state.over = true;
    var rewardFichas = 0;
    var title = '', sub = '', pipsText = '';

    if (kind === 'domino'){
      var winTeam = SEATS[winnerSeat].team;
      var pipsOtherTeam = 0;
      for (var s = 0; s < 4; s++){
        if (SEATS[s].team !== winTeam){
          pipsOtherTeam += handPips(state.hands[s]);
        }
      }
      if (winTeam === 'A') state.scoreA += pipsOtherTeam; else state.scoreB += pipsOtherTeam;
      rewardFichas = 500 + pipsOtherTeam * 40 + (capicua ? 5000 : 0);
      title = capicua ? '¡CAPICÚA!' : '¡DOMINÓ!';
      sub = SEATS[winnerSeat].name + (winnerSeat === 0 ? ' ganaste la mano' : ' se quedó sin fichas') + ' — Equipo ' + winTeam + ' anota ' + pipsOtherTeam + ' puntos';
      vibrate(capicua ? [70,40,220,30,90] : [50,40,120]);
    } else {
      var pipsA = handPips(state.hands[0]) + handPips(state.hands[2]);
      var pipsB = handPips(state.hands[1]) + handPips(state.hands[3]);
      var winTeam2;
      if (pipsA < pipsB){ winTeam2 = 'A'; state.scoreA += (pipsB - pipsA); }
      else if (pipsB < pipsA){ winTeam2 = 'B'; state.scoreB += (pipsA - pipsB); }
      else { winTeam2 = null; }
      rewardFichas = winTeam2 === 'A' ? 300 + Math.abs(pipsB - pipsA) * 30 : 150;
      title = '¡TRANQUE!';
      sub = winTeam2 ? ('Mesa bloqueada — Equipo ' + winTeam2 + ' gana con menos fichas en mano') : 'Mesa bloqueada — empate en fichas';
      pipsText = 'Equipo A: ' + pipsA + ' pts en mano · Equipo B: ' + pipsB + ' pts en mano';
      vibrate([60,50,60,50,160]);
    }

    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalSub').textContent = sub;
    document.getElementById('modalPips').textContent = pipsText;
    document.getElementById('modalFichas').textContent = '+' + rewardFichas.toLocaleString('es-DO') + ' Fichas';
    document.getElementById('modalScrim').classList.add('show');
    render();
  }

  function handPips(hand){
    var total = 0;
    for (var i = 0; i < hand.length; i++) total += hand[i].x + hand[i].y;
    return total;
  }

  function showToast(text){
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  function pipPts(n){
    var table = {
      0: [], 1: [[50,50]], 2: [[30,30],[70,70]], 3: [[30,30],[50,50],[70,70]],
      4: [[30,30],[70,30],[30,70],[70,70]], 5: [[30,30],[70,30],[50,50],[30,70],[70,70]],
      6: [[30,25],[70,25],[30,50],[70,50],[30,75],[70,75]]
    };
    return table[n] || [];
  }

  function tileSVG(a, b, w, h, vertical){
    var vw = vertical ? 100 : 200, vh = vertical ? 200 : 100;
    var half1 = vertical
      ? '<line x1="10" y1="100" x2="90" y2="100" stroke="#4de8ff" stroke-width="2"/>'
      : '<line x1="100" y1="10" x2="100" y2="90" stroke="#4de8ff" stroke-width="2"/>';
    function pips(n, offsetX, offsetY){
      var pts = pipPts(n);
      var out = '';
      for (var i = 0; i < pts.length; i++){
        out += '<circle cx="' + (pts[i][0] + offsetX) + '" cy="' + (pts[i][1] + offsetY) + '" r="7" fill="url(#pipCyan)"/>';
      }
      return out;
    }
    var pipsA, pipsB;
    if (vertical){
      pipsA = pips(a, 0, 0);
      pipsB = pips(b, 0, 100);
    } else {
      pipsA = pips(a, 0, 0);
      pipsB = pips(b, 100, 0);
    }
    return '<svg class="tile-cyan" width="' + w + '" height="' + h + '" viewBox="0 0 ' + vw + ' ' + vh + '">' +
      '<rect x="3" y="3" width="' + (vw-6) + '" height="' + (vh-6) + '" rx="10" fill="url(#tileGlass)" stroke="#4de8ff" stroke-width="2.5"/>' +
      '<rect x="3" y="3" width="' + (vw-6) + '" height="' + (vh-6) + '" rx="10" fill="url(#tileSheenCyan)"/>' +
      half1 + pipsA + pipsB +
      '</svg>';
  }

  function defsSVG(){
    return '<svg width="0" height="0" style="position:absolute;"><defs>' +
      '<linearGradient id="tileGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#202c38"/><stop offset="55%" stop-color="#0e1620"/><stop offset="100%" stop-color="#060a0f"/></linearGradient>' +
      '<linearGradient id="tileSheenCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d8faff" stop-opacity="0.4"/><stop offset="18%" stop-color="#9de9ff" stop-opacity="0"/><stop offset="100%" stop-color="#9de9ff" stop-opacity="0"/></linearGradient>' +
      '<radialGradient id="pipCyan" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#eafdff"/><stop offset="38%" stop-color="#5be8ff"/><stop offset="100%" stop-color="#0a89a8"/></radialGradient>' +
      '</defs></svg>';
  }

  function render(){
    var chainArea = document.getElementById('chainArea');
    var html = defsSVG();
    for (var i = 0; i < state.chain.length; i++){
      var c = state.chain[i];
      html += '<div class="chain-tile">' + tileSVG(c.a, c.b, 56, 28, false) + '</div>';
    }
    chainArea.innerHTML = html || '<div style="color:#4a3f2c;font-size:11px;">Esperando el doble 6…</div>';

    for (var s = 1; s <= 3; s++){
      var seatDef = SEATS[s];
      var seatEl = document.getElementById(seatDef.el === 'north' ? 'seatNorth' : (seatDef.el === 'west' ? 'seatWest' : 'seatEast'));
      seatEl.classList.toggle('turn', state.turn === s && !state.over);
      document.getElementById((seatDef.el === 'north' ? 'north' : seatDef.el) + 'Count').textContent = state.hands[s].length;
    }
    var nt = document.getElementById('northTiles');
    var fd = '';
    for (var k = 0; k < state.hands[2].length; k++) fd += '<span class="facedown"></span>';
    nt.innerHTML = fd;

    var chip = document.getElementById('turnChip');
    chip.textContent = state.over ? 'Mano terminada' : (state.turn === 0 ? 'Tu turno' : SEATS[state.turn].name + ' está jugando…');

    var actions = document.getElementById('actionsRow');
    actions.innerHTML = '';
    if (!state.over && state.turn === 0 && !seatHasValidMove(0)){
      var btn = document.createElement('button');
      btn.textContent = 'PASAR';
      btn.onclick = function(){ vibrate(15); passSeat(0); };
      actions.appendChild(btn);
    }

    renderHand();
    document.getElementById('scoreA').textContent = state.scoreA;
    document.getElementById('scoreB').textContent = state.scoreB;
  }

  function renderHand(){
    var row = document.getElementById('handRow');
    row.innerHTML = '';
    var hand = state.hands[0];
    for (var i = 0; i < hand.length; i++){
      (function(tile, idx){
        var m = tileMatchesEnds(tile);
        var isValid = (m.left || m.right) && state.turn === 0 && !state.over;
        var wrap = document.createElement('div');
        wrap.className = 'hand-tile ' + (isValid ? 'valid' : 'invalid') + (state.selectedTileIdx === idx ? ' selected' : '');
        wrap.innerHTML = tileSVG(tile.x, tile.y, 40, 80, true);

        if (state.selectedTileIdx === idx && state.awaitingSide){
          var picker = document.createElement('div');
          picker.className = 'sidepick';
          var bl = document.createElement('button'); bl.textContent = '◄ Izquierda';
          bl.onclick = function(e){ e.stopPropagation(); vibrate(30); state.selectedTileIdx = null; state.awaitingSide = false; playTile(0, tile, 'left'); };
          var br = document.createElement('button'); br.textContent = 'Derecha ►';
          br.onclick = function(e){ e.stopPropagation(); vibrate(30); state.selectedTileIdx = null; state.awaitingSide = false; playTile(0, tile, 'right'); };
          picker.appendChild(bl); picker.appendChild(br);
          wrap.appendChild(picker);
        }

        wrap.onclick = function(){
          if (!isValid) return;
          if (!state.chain.length){
            vibrate(30);
            playTile(0, tile, 'left');
            return;
          }
          if (m.left && m.right && leftEnd() !== rightEnd()){
            state.selectedTileIdx = idx;
            state.awaitingSide = true;
            render();
            return;
          }
          vibrate(30);
          playTile(0, tile, m.left ? 'left' : 'right');
        };
        row.appendChild(wrap);
      })(hand[i], i);
    }
  }

  document.getElementById('modalPlayAgain').addEventListener('click', function(){
    document.getElementById('modalScrim').classList.remove('show');
    newGame();
  });

  newGame();
})();
</script>
</body>
</html>
